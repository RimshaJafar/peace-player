# Project Details
name: ecommerce_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.2

# Packages Details
dependencies:
  capped_progress_indicator: ^0.0.2
  carousel_slider: ^5.0.0
  chewie: ^1.11.3
  cloud_firestore: ^5.6.5
  connectivity_plus: ^6.0.3
  cupertino_icons: ^1.0.8
  curved_navigation_bar: ^1.0.6
  file_picker: ^10.1.2
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  firebase_storage: ^12.4.4
  firebase_ui_oauth_google: ^1.4.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_launcher_icons: ^0.14.4
  flutter_markdown_plus: ^1.0.5
  flutter_rating_bar: ^4.0.1
  flutter_staggered_animations: ^1.1.1
  get: ^4.7.2
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  google_sign_in: ^6.3.0
  http: ^1.3.0
  http_parser: ^4.1.2
  iconsax: ^0.0.8
  image_picker: ^1.1.2
  intl: ^0.20.0
  just_audio: ^0.10.2
  logger: ^2.5.0
  lottie: ^3.3.1
  marquee: ^2.2.3
  readmore: ^3.0.0
  sign_in_with_apple: ^7.0.1
  smooth_page_indicator: ^1.2.1
  url_launcher: ^6.3.1
  permission_handler: ^12.0.1
  video_player: ^2.10.1
  youtube_player_flutter: ^9.1.1
  youtube_player_iframe: ^5.2.1
  audioplayers: ^6.1.0
  youtube_explode_dart: ^3.0.5
  record: ^6.1.2
  path_provider: ^2.1.4
  geolocator: ^10.1.0
  flutter_compass: ^0.8.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.0
  flutter_stripe: ^11.4.0
  graphview: ^1.3.4
  open_filex: ^4.5.0
  share_plus: ^10.1.4

  # Camera for AI scanner
  camera: ^0.11.0+2

  # Voice navigation dependencies
  porcupine_flutter: ^4.0.0
  vibration: ^3.1.5

# End Packages Details
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logos/
    - assets/icons/
    - assets/images/content/
    - assets/images/kids/
    - assets/images/banners/
    - assets/images/animations/
    - assets/images/on_boarding_images/
    - assets/porcupine/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Lateef-Light.ttf
          weight: 300
        - asset: assets/fonts/Lateef-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lateef-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lateef-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lateef-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lateef-ExtraBold.ttf
          weight: 800

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/peace_player_logo.png"
